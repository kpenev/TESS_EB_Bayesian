<div class="{{ list_name }}"> 
    <ul>
        <h3 class="list-name"> {{ list_name }} ({{ list|length }}) </h3>
        {% for ticid in list %}
        <li
                {% if ticid.0 == displayed_ticid %}
                class="displayed"
                {% endif %}
            >
            <a href="{% url review|add:'_jump' displayed_ticid=ticid.0 %}" 
               {% if ticid.1 == 1 %}
               class="rendered"
               {% else %}
               not-rendered
               {% endif %}> {{ ticid.0 }} 
            </a> 
        </li>
        {% endfor %}
    </ul>
</div>
